# One virtual host for all deployments: `<id>.{{ inventory_hostname }}` is
# served by the deployment `<id>`, `{{ inventory_hostname }}` itself by `main`.
# Deployments don't touch the nginx config at all, they just need to create
# their socket in `/opt/tobira/<id>/socket/`.

map $host $tobira_id {
   ~^(?<tobira_sub>[a-z0-9-]+)\.{{ inventory_hostname | regex_escape }}$  $tobira_sub;
   default                                                       main;
}

server {
   listen              443 ssl;
   listen         [::]:443 ssl;

   # A regex has lower priority than exact names, so this doesn't conflict with
   # any per-deployment configs that still exist from before.
   server_name         "~^([a-z0-9-]+\.)?{{ inventory_hostname | regex_escape }}$";

   ssl_certificate_key /etc/nginx/ssl/{{ inventory_hostname }}.key;
   ssl_certificate     /etc/nginx/ssl/{{ inventory_hostname }}.crt;

   location / {
      # Unknown deployment. We can't check for the socket itself as `-e` is
      # always false for sockets.
      if (!-d /opt/tobira/$tobira_id/socket) {
         return 404;
      }

      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $http_host;

      proxy_pass http://unix:/opt/tobira/$tobira_id/socket/tobira.sock;

      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer-when-downgrade always;
      add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
   }
}
