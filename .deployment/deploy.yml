---

- hosts: all

  vars:
    # will usually be overwritten by --extra-vars='deployid=<id>'
    id: "{{ deployid }}"
    opencast_admin_password: '{{ lookup("env", "OPENCAST_ADMIN_PASSWORD") }}'

  tasks:
    # MIGRATION: Deployments used to have their own unit files
    # (`tobira-<id>.service`), now we use systemd template units
    # (`tobira@<id>.service`). If this deployment still has the old units, stop
    # and remove them. Can be removed once no old-style deployments are left.
    - name: check for legacy service files
      stat:
        path: /etc/systemd/system/tobira-{{ id }}.service
      register: legacy_units

    - name: stop and disable legacy services
      become: true
      systemd:
        name: '{{ item }}-{{ id }}'
        state: stopped
        enabled: false
      ignore_errors: true
      with_items:
        - tobira
        - tobiraworker
        - tobiraauth
      when: legacy_units.stat.exists

    - name: remove legacy service files
      become: true
      file:
        path: /etc/systemd/system/{{ item }}-{{ id }}.service
        state: absent
      with_items:
        - tobira
        - tobiraworker
        - tobiraauth
      when: legacy_units.stat.exists

    - name: reload systemd after removing legacy service files
      become: true
      systemd:
        daemon_reload: true
      when: legacy_units.stat.exists

    # Similarly, nginx used to have one vhost per deployment, now one vhost
    # (installed by `setup-server.yml`) serves all deployments.
    - name: remove legacy nginx vhost
      become: true
      file:
        path: /etc/nginx/conf.d/tobira-{{ id }}.conf
        state: absent
      notify: reload nginx
    # ---- END MIGRATION

    # We always recreate the DB from the last release dump. To do that, we have
    # to stop Tobira in case it's already running.
    - name: stop tobira
      become: true
      systemd:
        name: '{{ item }}@{{ id }}'
        state: stopped
      ignore_errors: true
      with_items:
        - tobira
        - tobiraworker

    - name: drop database
      become: true
      become_user: postgres
      community.postgresql.postgresql_db:
        name: tobira-{{ id }}
        state: absent

    - name: create tobira postgres user
      become: true
      become_user: postgres
      community.postgresql.postgresql_user:
        name: tobira-{{ id }}
        password: tobira-{{ id }}

    - name: create database
      become: true
      become_user: postgres
      community.postgresql.postgresql_db:
        name: tobira-{{ id }}
        owner: tobira-{{ id }}

    - name: add postgres extensions
      become: true
      become_user: postgres
      community.postgresql.postgresql_ext:
        name: "{{ item }}"
        db: tobira-{{ id }}
      loop:
          - hstore
          - pgcrypto

    # TOBIRA


    - name: create application directory
      become: true
      file:
        path: /opt/tobira/{{ id }}
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: create socket directory
      become: true
      file:
        path: /opt/tobira/{{ id }}/socket
        state: directory
        owner: tobira
        group: tobira
        setype: httpd_sys_rw_content_t
        mode: '0755'

    - name: deploy tobira executable & scripts
      become: true
      copy:
        src: "{{ item }}"
        dest: /opt/tobira/{{ id }}/
        owner: root
        group: root
        mode: '0755'
      with_items:
        - tobira
        - login-handler.js
      notify: restart tobira

    - name: deploy demo assets
      become: true
      copy:
        src: "{{ item }}"
        dest: /opt/tobira/{{ id }}/
        owner: root
        group: root
        mode: '0644'
      with_items:
        - logo-small.svg
        - logo-large.svg
        - logo-large-dark.svg
        - favicon.svg
      notify: restart tobira

    - name: deploy configuration
      become: true
      template:
        src: config.toml
        dest: /opt/tobira/{{ id }}/
        owner: root
        group: root
        mode: '0644'
      notify: restart tobira

    - name: Download latest DB dump
      become: true
      shell: |
        curl -fSL 'https://github.com/elan-ev/tobira/raw/db-dumps/db-dump-latest.xz' \
        | xz -d > db-dump.pgc && chmod 0644 db-dump.pgc
      args:
        chdir: /opt/tobira/{{ id }}/
        creates: /opt/tobira/{{ id }}/db-dump.pgc

    - name: Restore DB dump
      become: true
      become_user: postgres
      community.postgresql.postgresql_db:
        state: restore
        # The ending `pgc` is important so that `pg_restore` (and not psql) is used.
        target: /opt/tobira/{{ id }}/db-dump.pgc
        name:  tobira-{{ id }}
        target_opts: '--no-comments --no-owner --role=tobira-{{ id }}'

    # We don't need it anymore and it takes quite a bit of storage space.
    - name: Delete DB dump file
      become: true
      file:
        path: /opt/tobira/{{ id }}/db-dump.pgc
        state: absent

    - name: run database migration
      become: true
      become_user: tobira
      command:
        cmd: /opt/tobira/{{ id }}/tobira db migrate
        chdir: /opt/tobira/{{ id }}/

    - name: sync with Opencast once
      become: true
      become_user: tobira
      command:
        cmd: /opt/tobira/{{ id }}/tobira sync run
        chdir: /opt/tobira/{{ id }}/

    - name: Clear search index
      become: true
      become_user: tobira
      command:
        cmd: /opt/tobira/{{ id }}/tobira search-index clear --yes-absolutely-clear-index
        chdir: /opt/tobira/{{ id }}/

    - name: Build search index once
      become: true
      become_user: tobira
      command:
        cmd: /opt/tobira/{{ id }}/tobira search-index update
        chdir: /opt/tobira/{{ id }}/

    - name: Add test-data known groups/users
      become: true
      copy:
        src: known-{{item}}.json
        dest: /opt/tobira/{{ id }}/known-{{item}}.json
        owner: root
        group: root
        mode: '0644'
      with_items:
        - groups
        - users

    - name: Configure known groups/users
      become: true
      become_user: tobira
      command:
        cmd: /opt/tobira/{{ id }}/tobira known-{{item}} upsert known-{{item}}.json
        chdir: /opt/tobira/{{ id }}/
      with_items:
        - groups
        - users

    - name: start and enable tobira
      become: true
      systemd:
        name: '{{ item }}@{{ id }}'
        state: started
        enabled: true
      with_items:
        - tobira
        - tobiraworker
        - tobiraauth


  handlers:
    - name: restart tobira
      become: true
      service:
        name: '{{ item }}@{{ id }}'
        state: restarted
      with_items:
        - tobira
        - tobiraworker
        - tobiraauth

    - name: reload nginx
      become: true
      service:
        name: nginx
        state: reloaded
