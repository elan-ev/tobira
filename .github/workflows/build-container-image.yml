name: Build & Publish Tobira image

# Only run once a release is actually published (`build-release.yml` creates a
# draft for every tag), so no image appears for a tag that never gets released.
on:
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

jobs:
  # Build each platform on a runner of that platform (no emulation) and push it
  # without tags. The tagged multi-platform image is created in `merge`.
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: util/scripts/build-container-image.sh push-by-digest > ref
        env:
          TOBIRA_CONTAINER_VERSION: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ref-${{ strategy.job-index }}
          path: ref

  merge:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          pattern: ref-*
          path: refs

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and tag images
        run: |
          refs=()
          for f in refs/*/ref; do
            refs+=("$(cat "$f")")
          done
          util/scripts/build-container-image.sh merge "${refs[@]}"
        env:
          TOBIRA_CONTAINER_VERSION: ${{ github.ref_name }}
