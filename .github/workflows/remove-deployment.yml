name: Remove deployment

on:
  delete:
  pull_request_target:
    types: [ closed ]

# Must match the group in `deploy.yml` for the same branch/PR.
concurrency:
  group: deploy-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.event.ref }}
  cancel-in-progress: false

jobs:
  main:
    if: github.repository_owner == 'elan-ev'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: prepare deploy key
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      run: |
        install -dm 700 ~/.ssh/
        echo "${DEPLOY_KEY}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan tobira.opencast.org >> ~/.ssh/known_hosts

    - name: install ansible postgres extensions
      run: ansible-galaxy collection install community.postgresql

    - name: Write deploy ID (for branch) to file
      run: echo "DEPLOY_ID=$(./.deployment/deploy-id.sh "${{ github.event.ref }}")" >> $GITHUB_ENV
      if: github.event_name == 'delete'

    - name: Write deploy ID (for PR) to file
      run: echo "DEPLOY_ID=pr${{ github.event.pull_request.number }}" >> $GITHUB_ENV
      if: github.event_name != 'delete'

    - name: Delete GitHub deployments
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/deployments?environment=deployment-test&task=deploy:$DEPLOY_ID&per_page=100" --jq '.[].id'); do
          echo "Deleting deployment $id"
          gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive --silent
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/$id" --silent
        done

    - name: remove deployment
      working-directory: .deployment
      run: >
        ansible-playbook
        --private-key=~/.ssh/id_ed25519
        --extra-vars="deployid='${{ env.DEPLOY_ID }}'"
        -u github
        remove-deployment.yml
